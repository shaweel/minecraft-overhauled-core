name: Build the minecraft-overhauled-core .jar file
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Build the minecraft-overhauled-core .jar file
        run: | 
          chmod +x ./gradlew
          ./gradlew build

      - name: Fetch modVersion from gradle.properties
        run: |
          echo "MOD_VERSION=$(./gradlew properties -q | grep '^mod_version:' | awk '{print $2}')" >> $GITHUB_ENV

      - name: Upload the minecraft-overhauled-core .jar file
        uses: actions/upload-artifact@v7
        with:
          name: "minecraft-overhauled-core-v${{ env.MOD_VERSION }}-build${{ github.run_number }}"
          path: build/libs/minecraft-overhauled-core-${{ env.MOD_VERSION }}.jar